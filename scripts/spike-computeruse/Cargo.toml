[package]
name = "spike-computeruse"
version = "0.1.0"
edition = "2021"
publish = false
description = "Throwaway feasibility spike: can Jarvis inspect and drive real Windows apps?"

[dependencies]
serde = { version = "1.0.216", features = ["derive"] }
serde_json = "1.0.134"

[target.'cfg(windows)'.dependencies.windows]
version = "0.58.0"
features = [
  "Win32_Foundation",
  "Win32_Graphics_Gdi",
  "Win32_System_Com",
  "Win32_System_Threading",
  "Win32_UI_Accessibility",
  "Win32_UI_Input_KeyboardAndMouse",
  "Win32_UI_WindowsAndMessaging",
]

[[bin]]
name = "spike-computeruse"
path = "src/main.rs"
